<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Corrección de Trayectoria - Cuadrante I</title>
    <style>
        :root {
            --bg: #ffffff;
            --grid-line: #1a3a5a; /* Azul oscuro para la cuadrícula */
            --inercia: #e74c3c; /* Rojo para el vector A */
            --impulso: #3498db; /* Azul para el vector B */
            --objetivo: #27ae60; /* Verde para el punto O */
            --text: #2c3e50;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }
        .container { 
            background: #fff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 650px;
        }
        h2 { margin-top: 0; color: var(--grid-line); }
        
        .formula-card {
            font-size: 2rem;
            margin: 10px 0;
            padding: 15px;
            background: #f8f9fa;
            border: 2px solid var(--grid-line);
            border-radius: 10px;
            font-weight: bold;
        }

        canvas { 
            background: #fff; 
            border-left: 3px solid var(--grid-line); 
            border-bottom: 3px solid var(--grid-line);
            margin: 20px 0;
        }

        .controls { 
            background: #f1f3f5;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input { 
            width: 70px; 
            padding: 10px; 
            font-size: 1.2rem; 
            border: 2px solid var(--impulso); 
            border-radius: 6px; 
            text-align: center;
        }

        button { 
            background: var(--grid-line); 
            color: white; 
            border: none; 
            padding: 12px 30px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background: #0d253f; }

        .legend { display: flex; justify-content: center; gap: 20px; font-size: 0.9rem; margin-bottom: 10px; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Corrección de Trayectoria Nave UNAM</h2>
        <p>Ajusta el impulso <b>B</b> para que la suma con la inercia <b>A</b> llegue al objetivo <b>O</b>.</p>

        <div class="formula-card">O = A + B</div>

        <div class="legend">
            <div class="legend-item"><div class="dot" style="background:var(--inercia)"></div> Inercia A</div>
            <div class="legend-item"><div class="dot" style="background:var(--impulso)"></div> Tu Impulso B</div>
            <div class="legend-item"><div class="dot" style="background:var(--objetivo)"></div> Objetivo O</div>
        </div>

        <canvas id="plano" width="500" height="500"></canvas>

        <div class="controls">
            <div>
                Vector B = ( 
                <input type="number" id="bx" min="0" placeholder="X"> , 
                <input type="number" id="by" min="0" placeholder="Y"> )
            </div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="launch()">Aplicar Impulso</button>
                <button style="background:#95a5a6" onclick="resetGame()">Nuevo Reto</button>
            </div>
        </div>

        <h3 id="feedback" style="margin-top: 20px; height: 30px;"></h3>
    </div>

    <script>
        const canvas = document.getElementById('plano');
        const ctx = canvas.getContext('2d');
        const scale = 40; // Cuadrícula más grande (12 unidades)
        const margin = 10;

        let vA = { x: 0, y: 0 };
        let vTarget = { x: 0, y: 0 };

        function resetGame() {
            document.getElementById('bx').value = '';
            document.getElementById('by').value = '';
            document.getElementById('feedback').innerText = '';
            
            // Generar valores solo en Cuadrante I (0 a 11)
            vA = { x: rand(1, 5), y: rand(1, 5) };
            vTarget = { x: rand(6, 11), y: rand(6, 11) };
            draw();
        }

        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1) + min); }

        function draw(vB = null) {
            ctx.clearRect(0, 0, 500, 500);
            
            // Dibujar Cuadrícula Azul Oscuro
            ctx.strokeStyle = '#00acc1'; // Líneas Azul Cian
            ctx.lineWidth = 1;
            for(let i=0; i<=500; i+=scale) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,500); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(500,i); ctx.stroke();
            }

            // Marcas de los números en los ejes
            ctx.fillStyle = '#1a3a5a';
            ctx.font = '12px Arial';
            for(let i=1; i<=12; i++) {
                ctx.fillText(i, i*scale - 5, 495); // Eje X
                ctx.fillText(i, 5, 500 - i*scale + 5); // Eje Y
            }

            // Dibujar OBJETIVO O (Círculo Verde)
            ctx.fillStyle = '#27ae60';
            ctx.beginPath();
            ctx.arc(vTarget.x * scale, 500 - vTarget.y * scale, 10, 0, Math.PI*2);
            ctx.fill();

            // Dibujar VECTOR A (Rojo) desde el origen (0,0)
            drawArrow(0, 500, vA.x * scale, 500 - vA.y * scale, '#e74c3c');

            if (vB) {
                const headAX = vA.x * scale;
                const headAY = 500 - vA.y * scale;
                
                // Dibujar VECTOR B (Azul) desde la cabeza de A
                drawArrow(headAX, headAY, headAX + vB.x * scale, headAY - vB.y * scale, '#3498db');
                
                // Resultante punteada
                ctx.setLineDash([5, 5]);
                ctx.strokeStyle = '#27ae60';
                ctx.beginPath();
                ctx.moveTo(0, 500);
                ctx.lineTo(headAX + vB.x * scale, headAY - vB.y * scale);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function drawArrow(x1, y1, x2, y2, color) {
            const headlen = 15;
            const angle = Math.atan2(y2 - y1, x2 - x1);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath(); ctx.fillStyle = color; ctx.fill();
        }

        function launch() {
            const bx = parseInt(document.getElementById('bx').value) || 0;
            const by = parseInt(document.getElementById('by').value) || 0;
            draw({x: bx, y: by});

            const resX = vA.x + bx;
            const resY = vA.y + by;
            const feedback = document.getElementById('feedback');

            if (resX === vTarget.x && resY === vTarget.y) {
                feedback.innerText = "🚀 ¡ÉXITO! Trayectoria corregida.";
                feedback.style.color = "#27ae60";
            } else {
                feedback.innerText = "❌ Fallaste. Revisa tu suma vectorial.";
                feedback.style.color = "#e74c3c";
            }
        }

        resetGame();
    </script>
</body>
</html>
