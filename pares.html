<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Math Match: FES Acatlán</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
        :root { --primary: #1a2a3a; --accent: #27ae60; --error: #c0392b; --card-bg: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        #nav-levels { margin-bottom: 20px; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; border: none; background: var(--primary); color: white; border-radius: 5px; font-weight: bold; }
        button:hover { background: #34495e; }

        #feedback { height: 35px; margin-bottom: 15px; font-weight: bold; font-size: 1.2rem; text-align: center; color: var(--primary); }
        
        #game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 800px; }

        .card {
            width: 150px; height: 100px; background: var(--card-bg); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; color: white; font-size: 1.1rem; text-align: center; padding: 10px;
        }
        .card.flipped { background: white; color: black; border: 2px solid var(--primary); }
        .card.matched { background: var(--accent) !important; color: white; cursor: default; }
        .card.wrong { background: var(--error) !important; color: white; }
    </style>
</head>
<body>

    <h1>Math Match: Actuaría</h1>
    
    <div id="nav-levels">
        <button onclick="initLevel(1)">Nivel 0</button>
        <button onclick="initLevel(2)">Conjuntos</button>
        <button onclick="initLevel(3)">Cálculo</button>
        <button onclick="initLevel(4)">Negaciones</button>
        <button onclick="initLevel(5)">Geometría</button>
    </div>

    <div id="feedback">Selecciona un nivel para comenzar</div>
    <div id="game-board"></div>

    <script>
        const levels = {
            1: [
                { id: 1, a: '\\forall', b: 'Para todo' },
                { id: 2, a: '\\exists', b: 'Existe' },
                { id: 3, a: '\\exists !', b: 'Existe único' },
                { id: 4, a: '\\nexists', b: 'No existe' },
                { id: 5, a: '>', b: 'Mayor que' },
                { id: 6, a: '<', b: 'Menor que' },
                { id: 7, a: '\\in', b: 'Pertenece a' },
                { id: 8, a: '\\implies', b: 'Entonces' }
            ],
            2: [
                { id: 1, a: 'x \\in A \\cup B', b: 'x en A o en B' },
                { id: 2, a: 'x \\in A \\cap B', b: 'x en A y en B' },
                { id: 3, a: 'A \\subseteq B', b: 'Subconjunto' },
                { id: 4, a: '\\emptyset', b: 'Conjunto vacío' },
                { id: 5, a: 'x \\in \\mathbb{Z}', b: 'x es Entero' },
                { id: 6, a: 'x \\in \\mathbb{R}^+', b: 'x es Real Positivo' },
                { id: 7, a: 'n \\in \\mathbb{N}', b: 'n es Natural' },
                { id: 8, a: '\\mathbb{R} \\setminus \\mathbb{Q}', b: 'Números Irracionales' }
            ],
            3: [
                { id: 1, a: '\\forall \\epsilon > 0, \\exists \\delta > 0', b: 'Entorno de Límite' },
                { id: 2, a: '0 < |x - a| < \\delta', b: 'x \\neq a' },
                { id: 3, a: 'D_f', b: 'Dominio' },
                { id: 4, a: 'C_f', b: 'Codominio' },
                { id: 5, a: 'f(x) = f(-x)', b: 'Función Par' },
                { id: 6, a: 'x < y \\implies f(x) < f(y)', b: 'Estrictamente Creciente' },
                { id: 7, a: 'f(x_1)=f(x_2) \\implies x_1=x_2', b: 'Inyectiva' },
                { id: 8, a: '\\text{Im}(f)', b: 'Imagen / Rango' }
            ],
            4: [
                { id: 1, a: '\\forall x, P(x)', b: '\\exists x \\mid \\neg P(x)' },
                { id: 2, a: '\\exists x \\mid P(x)', b: '\\forall x, \\neg P(x)' },
                { id: 3, a: 'P \\implies Q', b: 'P \\land \\neg Q' },
                { id: 4, a: 'A \\land B', b: '\\neg A \\lor \\neg B' },
                { id: 5, a: 'A \\lor B', b: '\\neg A \\land \\neg B' },
                { id: 6, a: 'P \\iff Q', b: '(P \\land \\neg Q) \\lor (Q \\land \\neg P)' }
            ],
            5: [
                { id: 1, a: '\\pi', b: '180^\\circ' },
                { id: 2, a: '2\\pi', b: '360^\\circ' },
                { id: 3, a: '\\sqrt{(x_2-x_1)^2 + (y_2-y_1)^2}', b: 'Distancia en el plano' },
                { id: 4, a: '\\vec{u} \\cdot \\vec{v} = 0', b: 'Vectores Ortogonales' },
                { id: 5, a: '\\|\\vec{v}\\|', b: 'Norma del vector' },
                { id: 6, a: '\\vec{u} = k\\vec{v}', b: 'Vectores Paralelos' },
                { id: 7, a: '\\frac{\\vec{v}}{\\|\\vec{v}\\|}', b: 'Vector Unitario' }
            ]
        };

        let flippedCards = [];
        let canClick = true;
        let matchedPairs = 0;
        let totalPairs = 0;

        function initLevel(lvl) {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            matchedPairs = 0;
            totalPairs = levels[lvl].length;
            document.getElementById('feedback').innerText = "¡Encuentra los pares!";
            document.getElementById('feedback').style.color = "var(--primary)";
            
            let deck = [];
            levels[lvl].forEach(item => {
                deck.push({ id: item.id, content: item.a, isMath: true });
                deck.push({ id: item.id, content: item.b, isMath: item.b.includes('\\') || item.b.includes('^') });
            });

            deck.sort(() => Math.random() - 0.5);
            deck.forEach(data => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.id = data.id;
                card.dataset.content = data.content;
                card.dataset.isMath = data.isMath;
                card.innerHTML = "?";
                card.onclick = () => handleFlip(card);
                board.appendChild(card);
            });
        }

        function handleFlip(card) {
            if (!canClick || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            card.classList.add('flipped');
            if (card.dataset.isMath === "true") katex.render(card.dataset.content, card);
            else card.innerText = card.dataset.content;

            flippedCards.push(card);
            if (flippedCards.length === 2) checkMatch();
        }

        function checkMatch() {
            canClick = false;
            const [c1, c2] = flippedCards;
            const feedback = document.getElementById('feedback');

            if (c1.dataset.id === c2.dataset.id) {
                matchedPairs++;
                c1.classList.add('matched'); c2.classList.add('matched');
                feedback.innerText = "¡Lógicamente impecable! Q.E.D.";
                feedback.style.color = "var(--accent)";
                flippedCards = [];
                canClick = true;
                if (matchedPairs === totalPairs) {
                    feedback.innerText = "¡Nivel completado con éxito!";
                }
            } else {
                c1.classList.add('wrong'); c2.classList.add('wrong');
                feedback.innerText = "La hipótesis era falsa.";
                feedback.style.color = "var(--error)";
                setTimeout(() => {
                    c1.classList.remove('flipped', 'wrong');
                    c2.classList.remove('flipped', 'wrong');
                    c1.innerHTML = "?"; c2.innerHTML = "?";
                    flippedCards = []; canClick = true;
                }, 1000);
            }
        }

        window.onload = () => initLevel(1);
    </script>
</body>
</html>
